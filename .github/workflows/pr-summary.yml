name: PR Event Summary
on:
  pull_request:
    paths:
      - 'events/curated/*.json'

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate event summary
        id: summary
        run: python3 scripts/pr_summary.py > /tmp/pr_summary.md
      - name: Post summary as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/pr_summary.md', 'utf8').trim();
            if (!summary) return;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const marker = '## 📋 Event PR Summary';
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            const body = `${marker}\n\n${summary}\n\n---\n*Automated summary generated from JSON diffs.*`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
