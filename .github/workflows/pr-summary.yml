name: PR Event Summary
on:
  pull_request:
    paths:
      - 'events/curated/*.json'

permissions:
  pull-requests: write
  contents: read

jobs:
  summarize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate event summary
        id: summary
        run: python3 scripts/pr_summary.py > /tmp/pr_summary.md
      - name: Post summary as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/pr_summary.md', 'utf8').trim();
            if (summary) {
              const body = `## 📋 Event PR Summary\n\n${summary}\n\n---\n*Automated summary generated from JSON diffs.*`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
