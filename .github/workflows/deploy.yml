name: Deploy to Production
on:
  push:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build database from JSON
        run: python3 build_db.py

      - name: Dump and import to production D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 dump_d1.py > /tmp/dump_d1.sql
          npx wrangler d1 execute was-geht-stutensee --file /tmp/dump_d1.sql --remote

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd cloudflare && python3 build.py && npx wrangler deploy

      - name: Send logs to Elastic
        if: always()
        env:
          ES_ENDPOINT: ${{ secrets.ELASTIC_ENDPOINT }}
          ES_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          curl -s -X POST "${ES_ENDPOINT}/_bulk" \
            -H "Authorization: ApiKey ${ES_API_KEY}" \
            -H "Content-Type: application/x-ndjson" \
            -d "{ \"index\": { \"_index\": \"logs-gha\" } }
      { \"@timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"workflow\": \"${{ github.workflow }}\", \"run_id\": \"${{ github.run_id }}\", \"branch\": \"${{ github.ref_name }}\", \"commit\": \"${{ github.sha }}\", \"status\": \"${{ job.status }}\", \"actor\": \"${{ github.actor }}\" }
      " || echo "Warning: log send failed (non-fatal)"
