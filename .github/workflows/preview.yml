name: PR Preview Worker
on:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  pull-requests: write
  contents: read

jobs:
  build-db:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run API tests
        run: |
          cd cloudflare && python3 build.py && npm ci && npm test

      - name: Build database from JSON
        run: python3 scripts/build_db.py

      - name: Dump and import to staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 scripts/dump_d1.py events/events.db curated_events > /tmp/dump_d1.sql
          npx wrangler d1 execute was-geht-stutensee-staging --file /tmp/dump_d1.sql --remote

      - name: Deploy preview worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          cd cloudflare && python3 build.py
          cat > preview.toml << EOF
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"

          [[d1_databases]]
          binding = "STUTENSEE_DB"
          database_name = "was-geht-stutensee-staging"
          database_id = "5ab57835-8cc1-4aae-a56f-3f0f8da83357"
          EOF
          npx wrangler deploy --config preview.toml 2>&1 | tee deploy.log
          URL=$(grep 'https\?://.*workers\.dev' deploy.log | head -1 | tr -d ' ')
          rm -f preview.toml
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Preview Worker\n\nDeployed at: ' + url + '\n\nThis worker uses the staging database. Data reflects the JSON files in this PR.'
            });

      - name: Send logs to Elastic
        if: always()
        env:
          ES_ENDPOINT: ${{ secrets.ELASTIC_ENDPOINT }}
          ES_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        run: |
          {
            echo '{ "index": { "_index": "logs-gha" } }'
            echo '{ "@timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "workflow": "${{ github.workflow }}", "run_id": "${{ github.run_id }}", "branch": "${{ github.ref_name }}", "commit": "${{ github.sha }}", "status": "${{ job.status }}", "actor": "${{ github.actor }}" }'
          } | curl -s -X POST "${ES_ENDPOINT}/_bulk" \
            -H "Authorization: ApiKey ${ES_API_KEY}" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary @- || echo "Warning: log send failed (non-fatal)"

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview worker
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          cat > cloudflare/cleanup.toml << 'RAWEOF2'
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"
          RAWEOF2
          cd cloudflare && sed -i "s/\${WORKER_NAME}/${WORKER_NAME}/" cleanup.toml
          npx wrangler delete --config cleanup.toml || echo "Worker already deleted or not found"
          rm -f cleanup.toml

      - name: Comment cleanup
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview worker deleted. ✅'
            });
