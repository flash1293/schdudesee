name: PR Preview Worker
on:
  pull_request:
    types: [opened, synchronize, closed]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  pull-requests: write
  contents: read

jobs:
  build-db:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build database from JSON
        run: python3 build_db.py

      - name: Dump and import to staging D1
        run: |
          python3 -c "
import sqlite3
conn = sqlite3.connect('events/events.db')
c = conn.cursor()
print('DROP TABLE IF EXISTS curated_events;')
for sql, in c.execute(\"SELECT sql FROM sqlite_master WHERE sql IS NOT NULL AND name = 'curated_events'\"):
    print(sql + ';')
def esc(v):
    if v is None: return 'NULL'
    if isinstance(v, (int, float)): return str(v)
    s = str(v).replace(\"'\", \"''\")
    return f\"'{s}'\"
for row in c.execute('SELECT * FROM curated_events'):
    vals = ', '.join(esc(v) for v in row)
    print(f'INSERT INTO curated_events VALUES ({vals});')
conn.close()
" > /tmp/dump_d1.sql
          npx wrangler d1 execute was-geht-stutensee-staging --file /tmp/dump_d1.sql --remote

      - name: Deploy preview worker
        id: deploy
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          cd cloudflare && python3 build.py
          cat > preview.toml << EOF
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"

          [[d1_databases]]
          binding = "STUTENSEE_DB"
          database_name = "was-geht-stutensee-staging"
          database_id = "5ab57835-8cc1-4aae-a56f-3f0f8da83357"
          EOF
          npx wrangler deploy --config preview.toml 2>&1 | tee deploy.log
          URL=$(grep -A1 'Deployed.*triggers' deploy.log | tail -1 | tr -d ' ')
          rm -f preview.toml
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Worker\n\nDeployed at: ${url}\n\nThis worker uses the staging database. Data reflects the JSON files in this PR.`
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview worker
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          cat > cloudflare/cleanup.toml << 'RAWEOF'
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"
          RAWEOF
          cd cloudflare && sed -i "s/\${WORKER_NAME}/${WORKER_NAME}/" cleanup.toml
          npx wrangler delete --config cleanup.toml || echo "Worker already deleted or not found"
          rm -f cleanup.toml

      - name: Comment cleanup
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview worker deleted. ✅'
            });
