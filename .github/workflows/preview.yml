name: PR Preview Worker
on:
  pull_request:
    types: [opened, synchronize, closed]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  pull-requests: write
  contents: read

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview worker
        id: deploy
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          
          # Build with the PR's index.html
          cd cloudflare && python3 build.py
          
          # Create temp wrangler.toml with per-PR name + staging D1
          cat > /tmp/wrangler.toml << EOF
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"

          [[d1_databases]]
          binding = "STUTENSEE_DB"
          database_name = "was-geht-stutensee-staging"
          database_id = "5ab57835-8cc1-4aae-a56f-3f0f8da83357"
          EOF
          
          # Deploy using temp config
          npx wrangler deploy --config /tmp/wrangler.toml 2>&1 | tee deploy.log
          
          # Extract URL
          URL=$(grep -oP 'https://[^\s]+\.workers\.dev' deploy.log | head -1)
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Worker\n\nDeployed at: ${url}\n\nThis worker uses the staging database. Data reflects the latest pipeline run.`
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview worker
        run: |
          WORKER_NAME="was-geht-stutensee-pr-${{ github.event.number }}"
          
          # Create minimal wrangler.toml for the delete
          cat > /tmp/wrangler.toml << EOF
          name = "${WORKER_NAME}"
          main = "src/worker.js"
          compatibility_date = "2025-04-01"
          EOF
          
          npx wrangler delete --config /tmp/wrangler.toml || echo "Worker already deleted or not found"

      - name: Comment cleanup
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Preview worker deleted. ✅'
            });
